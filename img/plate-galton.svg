<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img" aria-labelledby="pt pd" font-family="Iowan Old Style, Palatino Linotype, Palatino, Book Antiqua, Georgia, serif">
  <title id="pt">Plate I. Galton's ellipses, redrawn</title>
  <desc id="pd">Contours of equal frequency for child height against mid-parent height, using the correlation and spreads of Galton's 1886 family data (r about 0.50). A dashed diagonal marks "child equals mid-parent". Two nearly coincident solid lines through the centre show the regression of child on mid-parent: slope 0.71 from the notebook records, and slope two-thirds from Galton's printed table. Small circles mark where each ellipse has a vertical tangent; the regression line passes through them.</desc>

  <rect width="700" height="470" fill="#f4efe4"/>

  <!-- plot frame: x 90..450 is mid-parent 64..74 in, y 410..50 is child 64..74 in, 36 px per inch -->
  <g stroke="#c9bfae" stroke-width="0.6">
    <path d="M126 50 V410 M162 50 V410 M198 50 V410 M234 50 V410 M270 50 V410 M306 50 V410 M342 50 V410 M378 50 V410 M414 50 V410"/>
    <path d="M90 374 H450 M90 338 H450 M90 302 H450 M90 266 H450 M90 230 H450 M90 194 H450 M90 158 H450 M90 122 H450 M90 86 H450"/>
  </g>
  <rect x="90" y="50" width="360" height="360" fill="none" stroke="#1d2733" stroke-width="1.2"/>

  <!-- ticks and figures -->
  <g fill="#5d6672" font-size="13" text-anchor="middle">
    <text x="90" y="430">64</text><text x="162" y="430">66</text><text x="234" y="430">68</text>
    <text x="306" y="430">70</text><text x="378" y="430">72</text><text x="450" y="430">74</text>
  </g>
  <g fill="#5d6672" font-size="13" text-anchor="end">
    <text x="82" y="414">64</text><text x="82" y="342">66</text><text x="82" y="270">68</text>
    <text x="82" y="198">70</text><text x="82" y="126">72</text><text x="82" y="54">74</text>
  </g>
  <text x="270" y="456" fill="#1d2733" font-size="14" text-anchor="middle" font-style="italic">height of the mid-parent, inches</text>
  <text transform="translate(34 230) rotate(-90)" fill="#1d2733" font-size="14" text-anchor="middle" font-style="italic">height of the adult child, inches</text>

  <!-- y = x, "if children were their parents" -->
  <path d="M90 410 L450 50" stroke="#5d6672" stroke-width="1" stroke-dasharray="5 4" fill="none"/>
  <text x="150" y="402" fill="#5d6672" font-size="12" font-style="italic" transform="rotate(-45 150 402)">child = mid-parent</text>

  <!-- iso-frequency ellipses at 0.5, 1 and 1.5 SD; centre (69.2, 69.2); major axis 63.05 deg -->
  <g fill="none" stroke="#1d2733" stroke-width="0.9" transform="translate(277.2 222.8) rotate(-63.05)">
    <ellipse rx="50.4" ry="26.0"/>
    <ellipse rx="100.8" ry="52.1"/>
    <ellipse rx="151.1" ry="78.1" stroke-dasharray="1 2.5"/>
  </g>
  <circle cx="277.2" cy="222.8" r="2" fill="#1d2733"/>

  <!-- regression of child on mid-parent: 2/3 (Galton's table) and 0.713 (notebook) -->
  <path d="M90 347.6 L450 107.6" stroke="#5d6672" stroke-width="1.4" fill="none"/>
  <path d="M90 356.3 L450 99.6" stroke="#2e6b5e" stroke-width="1.6" fill="none"/>

  <!-- vertical-tangent points: (69.2 ± k·1.81, 69.2 ± k·1.28) -->
  <g fill="#f4efe4" stroke="#2e6b5e" stroke-width="1.2">
    <circle cx="342.3" cy="176.6" r="3.2"/><circle cx="212.1" cy="269.0" r="3.2"/>
    <circle cx="374.9" cy="153.6" r="3.2"/><circle cx="179.5" cy="292.0" r="3.2"/>
  </g>

  <!-- key, in the right margin -->
  <g font-size="13" fill="#1d2733">
    <path d="M466 112 H492" stroke="#2e6b5e" stroke-width="1.6"/>
    <text x="500" y="116">slope 0.71</text>
    <text x="500" y="132" fill="#5d6672" font-size="12" font-style="italic">the notebook, 934 children</text>
    <path d="M466 160 H492" stroke="#5d6672" stroke-width="1.4"/>
    <text x="500" y="164">slope ⅔</text>
    <text x="500" y="180" fill="#5d6672" font-size="12" font-style="italic">Galton's printed table</text>
    <path d="M466 208 H492" stroke="#5d6672" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="500" y="212">slope 1</text>
    <text x="500" y="228" fill="#5d6672" font-size="12" font-style="italic">no regression</text>
    <circle cx="479" cy="252" r="3.2" fill="#f4efe4" stroke="#2e6b5e" stroke-width="1.2"/>
    <text x="500" y="256">vertical tangent</text>
    <text x="500" y="272" fill="#5d6672" font-size="12" font-style="italic">the line passes through</text>
  </g>

  <text x="90" y="34" fill="#5d6672" font-size="13" letter-spacing="1.2">PLATE I · GALTON 1886, REDRAWN</text>
</svg>
